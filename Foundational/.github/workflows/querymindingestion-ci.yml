name: QueryMindIngestion CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'QueryMindIngestion/**'
      - '.github/workflows/querymindingestion-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'QueryMindIngestion/**'
      - '.github/workflows/querymindingestion-ci.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        required: false
        default: 'true'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: QueryMindIngestion/requirements.txt

      - name: Install linting dependencies
        working-directory: QueryMindIngestion
        run: |
          pip install --upgrade pip
          pip install flake8 black isort mypy
          pip install -r requirements.txt

      - name: Run flake8
        working-directory: QueryMindIngestion
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Check code formatting with black
        working-directory: QueryMindIngestion
        run: black --check . || true

      - name: Check import sorting with isort
        working-directory: QueryMindIngestion
        run: isort --check-only . || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: QueryMindIngestion/requirements.txt

      - name: Install dependencies
        working-directory: QueryMindIngestion
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run tests
        working-directory: QueryMindIngestion
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
        env:
          MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          OLLAMA_BASE_URL: http://localhost:11434

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./QueryMindIngestion/coverage.xml
          flags: querymindingestion
          name: querymindingestion-coverage
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "curl -f http://localhost:11434/api/tags || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: QueryMindIngestion/requirements.txt

      - name: Install dependencies
        working-directory: QueryMindIngestion
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Pull Ollama embedding model
        run: |
          docker exec $(docker ps -q -f ancestor=ollama/ollama:latest) ollama pull embeddinggemma || true

      - name: Run integration tests
        working-directory: QueryMindIngestion
        run: |
          pytest tests/test_ollama_integration.py tests/test_chunking_logic.py -v
        env:
          MONGODB_URI: mongodb://localhost:27017/
          MONGODB_DATABASE: test-db
          MONGODB_COLLECTION: test-collection
          OLLAMA_BASE_URL: http://localhost:11434
          EMBEDDING_MODEL: embeddinggemma

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: QueryMindIngestion/requirements.txt

      - name: Install dependencies
        working-directory: QueryMindIngestion
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety check
        working-directory: QueryMindIngestion
        run: |
          safety check --file requirements.txt || true

      - name: Run Bandit security scan
        working-directory: QueryMindIngestion
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . || true

      - name: Run Snyk security scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          working-directory: QueryMindIngestion

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/querymindingestion
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: QueryMindIngestion
          file: QueryMindIngestion/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, integration-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ secrets.INGESTION_PRODUCTION_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ${{ secrets.INGESTION_PRODUCTION_PATH }}
            git pull origin main
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d --build
            docker-compose -f docker-compose.yml ps

      - name: Verify deployment
        run: |
          echo "Ingestion service deployed successfully"
          echo "Monitor logs with: docker-compose -f docker-compose.yml logs -f"

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'QueryMindIngestion deployment to production ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

